<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynamic Quiz App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
<h1>Dynamic Quiz App</h1>

<button id="themeBtn">🌙 Dark Mode</button>
</header>

<div class="container">

<div class="controls">

<select id="category">
<option value="">Any Category</option>
</select>

<select id="difficulty">
<option value="">Any Difficulty</option>
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>

<button id="startBtn">
Start Quiz
</button>

</div>

<div class="scoreBox">

<h3>Score Panel</h3>

<p>Total: <span id="answered">0</span></p>

<p>Correct:
<span id="correct">0</span></p>

<p>Wrong:
<span id="wrong">0</span></p>

<p>Page Progress:
<span id="progress">0/5</span></p>

</div>

<div id="message"></div>

<div id="quiz"></div>

<button id="nextBtn" disabled>
Next
</button>

</div>

<script src="app.js"></script>

</body>
</html>
